# ═══════════════════════════════════════════════════════════════
# FILE: .github/workflows/master-pipeline.yml
# REPO: shiprathought/OctoberProject2026
# DEV REPO: jglick/simple-maven-project-with-tests
# ═══════════════════════════════════════════════════════════════
# "Run up to environment" — the dropdown controls how far the
# pipeline goes:
#   dev   → Build → DEV only
#   scram  → Build → DEV → scram
#   sit → Build → DEV → scram → SIT
#   Prod  → Build → DEV → scram → SIT → PROD
# ═══════════════════════════════════════════════════════════════

name: Master CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Run up to environment'
        required: true
        default: 'sit'
        type: choice
        options:
        - dev
        - scram
        - sit
        - prod
          

jobs:

  # ═════════════════════════════════════════════════════
  # STEP 1: BUILD APP + UNIT TESTS (DEV REPO - MAVEN)
  #   ➜ Always runs
  # ═════════════════════════════════════════════════════
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV repo
        uses: actions/checkout@v4
        with:
          repository: jglick/simple-maven-project-with-tests

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build & Run Unit Tests
        run: |
          echo "========================================="
          echo "  Building App + Running Unit Tests"
          echo "========================================="
          mvn clean install -Dmaven.test.failure.ignore=true

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/surefire-reports/
          retention-days: 30

  # ═════════════════════════════════════════════════════
  # STEP 2: DEPLOY DEV + SANITY TESTS
  #   ➜ Always runs (every option includes DEV)
  # ═════════════════════════════════════════════════════
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DEV
        run: echo "Deployed to DEV ✅"

  sanity-dev:
    name: DEV - Sanity Tests
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout scram repo
        uses: actions/checkout@v4
        with:
          repository: shiprathought/OctoberProject2026

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Playwright browsers
        id: pw-cache-dev
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.pw-cache-dev.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only
        if: steps.pw-cache-dev.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restore reportingLabs history
        uses: actions/cache@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-dev-${{ github.run_id }}
          restore-keys: reporting-labs-history-dev-

      - name: Run Sanity Tests on DEV
        run: |
          echo "========================================="
          echo "  Running SANITY @smoke on DEV"
          echo "========================================="
          npx playwright test --project=chromium --grep @smoke
        env:
          ENV: dev
          BASE_URL: ${{ secrets.BASE_URL }}
          User_Credential: ${{ secrets.User_Credential }}
          Pass_Credential: ${{ secrets.Pass_Credential }}

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload DEV HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-html-report
          path: reports/html-report/
          retention-days: 30

      - name: Upload DEV Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload DEV reportingLabs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-reportinglabs-report
          path: reporting-labs/
          retention-days: 30

  # ═════════════════════════════════════════════════════
  # STEP 3: DEPLOY scram + REGRESSION TESTS
  #   ➜ Runs when: scram, sit, or Prod
  # ═════════════════════════════════════════════════════
  deploy-scram:
    name: Deploy to scram
    needs: sanity-dev
    if: contains(fromJSON('["scram","sit","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to scram
        run: echo "Deployed to scram ✅"

  regression-scram:
    name: scram - Regression Tests
    needs: deploy-scram
    if: contains(fromJSON('["scram","sit","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    environment: scram
    steps:
      - name: Checkout scram repo
        uses: actions/checkout@v4
        with:
          repository: shiprathought/OctoberProject2026

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Playwright browsers
        id: pw-cache-qa
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.pw-cache-qa.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only
        if: steps.pw-cache-qa.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restore reportingLabs history
        uses: actions/cache@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-qa-${{ github.run_id }}
          restore-keys: reporting-labs-history-qa-

      - name: Run Regression Tests on scram
        run: |
          echo "========================================="
          echo "  Running REGRESSION (all tests) on scram"
          echo "========================================="
          npx playwright test --project=chromium --grep @regression
        env:
          ENV: scram
          BASE_URL: ${{ secrets.BASE_URL }}
          User_Credential: ${{ secrets.User_Credential }}
          Pass_Credential: ${{ secrets.Pass_Credential }}

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload SCRAM HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-html-report
          path: reports/html-report/
          retention-days: 30

      - name: Upload QA Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload QA reportingLabs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-reportinglabs-report
          path: reporting-labs/
          retention-days: 30

  # ═════════════════════════════════════════════════════
  # STEP 4: DEPLOY sit + SANITY TESTS
  #   ➜ Runs when: sit or Prod
  # ═════════════════════════════════════════════════════
  deploy-stage:
    name: Deploy to sit
    needs: regression-scram
    if: contains(fromJSON('["sit","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to sit
        run: echo "Deployed to sit ✅"

  sanity-stage:
    name: sit - Sanity Tests
    needs: deploy-sit
    if: contains(fromJSON('["sit","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    environment: sit

    steps:
      - name: Checkout QA repo
        uses: actions/checkout@v4
        with:
          repository: shiprathought/OctoberProject2026

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Playwright browsers
        id: pw-cache-stage
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.pw-cache-stage.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only
        if: steps.pw-cache-stage.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restore reportingLabs history
        uses: actions/cache@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-stage-${{ github.run_id }}
          restore-keys: reporting-labs-history-stage-

      - name: Run Sanity Tests on sit
        run: |
          echo "========================================="
          echo "  Running SANITY @smoke on sit"
          echo "========================================="
          npx playwright test --project=chromium --grep @smoke
        env:
          ENV: sit 
          BASE_URL: ${{ secrets.BASE_URL }}
          User_Credential: ${{ secrets.User_Credential }}
          Pass_Credential: ${{ secrets.Pass_Credential }}

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload sit HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sit-sanity-html-report
          path: reports/html-report/
          retention-days: 30

      - name: Upload sit Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sit-sanity-allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload sit reportingLabs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sit-sanity-reportinglabs-report
          path: reporting-labs/
          retention-days: 30

  # ═════════════════════════════════════════════════════
  # STEP 5: DEPLOY PROD + SMOKE TESTS
  #   ➜ Runs when: Prod only
  # ═════════════════════════════════════════════════════
  deploy-prod:
    name: Deploy to PROD
    needs: sanity-stage
    if: github.event.inputs.environment == 'Prod'
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Deploy to PROD
        run: echo "Deployed to PROD ✅"

  smoke-prod:
    name: PROD - Smoke Tests
    needs: deploy-prod
    if: github.event.inputs.environment == 'Prod'
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Checkout QA repo
        uses: actions/checkout@v4
        with:
          repository: shiprathought/OctoberProject2026

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Playwright browsers
        id: pw-cache-prod
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.pw-cache-prod.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only
        if: steps.pw-cache-prod.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restore reportingLabs history
        uses: actions/cache@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-prod-${{ github.run_id }}
          restore-keys: reporting-labs-history-prod-

      - name: Run Smoke Tests on PROD
        run: |
          echo "========================================="
          echo "  Running SMOKE @smoke on PROD"
          echo "========================================="
          npx playwright test --project=chromium --grep @smoke
        env:
          ENV: prod
          BASE_URL: ${{ secrets.BASE_URL }}
          User_Credential: ${{ secrets.User_Credential }}
          Pass_Credential: ${{ secrets.Pass_Credential }}

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload PROD HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-html-report
          path: reports/html-report/
          retention-days: 30

      - name: Upload PROD Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload PROD reportingLabs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-reportinglabs-report
          path: reporting-labs/
          retention-days: 30

  # ═════════════════════════════════════════════════════
  # PIPELINE SUMMARY (always runs — handles skipped jobs)
  # ═════════════════════════════════════════════════════
  summary:
    name: Pipeline Summary
    needs: [build, sanity-dev, regression-qa, sanity-stage, smoke-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Results
        run: |
          echo "═══════════════════════════════════════════"
          echo "       MASTER CI/CD PIPELINE SUMMARY"
          echo "═══════════════════════════════════════════"
          echo "  Selected env:    ${{ github.event.inputs.environment }}"
          echo "─────────────────────────────────────────"
          echo "  Build + Unit:    ${{ needs.build.result }}"
          echo "  DEV Sanity:      ${{ needs.sanity-dev.result }}"
          echo "  QA Regression:   ${{ needs.regression-qa.result }}"
          echo "  STAGE Sanity:    ${{ needs.sanity-stage.result }}"
          echo "  PROD Smoke:      ${{ needs.smoke-prod.result }}"
          echo "═══════════════════════════════════════════"
          echo ""
          echo "  ℹ️  'skipped' = not included in this run"
          echo "═══════════════════════════════════════════"